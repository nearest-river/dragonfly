
[workspace]
resolver = "3"
members = [
  "compiler/dragonfly-ast",
  "compiler/dragonfly-span",
  "compiler/dragonfly-lexer",
  "compiler/dragonfly-index",
  "compiler/dragonfly-index-macros", "compiler/dragonfly-stable-hash", "compiler/dragonfly_data_structures", "compiler/dragonfly-arena", "compiler/dragonfly-stable-hash-macros",
]

[workspace.package]
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/nearest-river/dragonfly.git"
authors = ["Nate River"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0.17"
unescape = "0.1.0"
half = "2.7.1"
f128 = "0.2.9"
unicode-ident = "1.0.24"
unicode-properties = { version = "0.1.4", features = ["emoji"] }
lexical = { version = "7.0.5", features = ["f128", "compact", "f16", "floats", "format", "integers", "lint", "parse", "power-of-two", "radix"] }
lexical-core = { version = "1.0.6", features = ["f128", "compact", "f16", "floats", "format", "integers", "lint", "parse", "power-of-two", "radix"] }
lexical-util = { version = "1.0.7", features = ["f128", "compact", "f16", "float16", "parse-floats", "parse-integers", "power-of-two", "radix", "write-floats", "write-integers", "format", "lint"] }
unicode-id-start = "1.4.0"
proptest = "1.11.0"
criterion = "0.8.2"
rustc-stable-hash = "0.1.2"
itoa = "1.0.18"
rayon = "1.12.0"
scoped-tls = "1.0.1"
smallvec = "1.15.2"
arrayvec = "0.7.8"
bitflags = "2.4.1"
either = "1.0"
elsa = "1.11.0"
ena = "0.14.3"
indexmap = "2.14.0"
measureme = "12.0.1"
parking_lot = "0.12"
stacker = "0.1.17"
tempfile = "3.2"
thin-vec = "0.2.15"
tracing = "0.1"
rustc-hash = "2.1.3"
libc = "0.2"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.2", features = ["full", "extra-traits"] }
dragonfly-stable-hash = { path = "../dragonfly-stable-hash/" }






